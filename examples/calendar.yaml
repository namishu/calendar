# Complete calendar configuration
# Use: namishu-calendar --year 2027 --month 9 --config calendar.yaml
# All distances are in millimeters; font sizes are in points.

# Paper and margins (A4 landscape).
# Margins extend to the visible title and the outside edges of the grid.
page:
  width: 297
  height: 210
  margin_top: 10
  margin_bottom: 10
  margin_left: 20
  margin_right: 20

# Month and year title, aligned with the left and right edges of the grid.
title:
  # January through December; names can be translated.
  months:
    - JANUARY
    - FEBRUARY
    - MARCH
    - APRIL
    - MAY
    - JUNE
    - JULY
    - AUGUST
    - SEPTEMBER
    - OCTOBER
    - NOVEMBER
    - DECEMBER
  font_size: 20
  color: "#707a93"
  # Clear space between the title's bottom edge and the weekday row's top edge.
  gap_after: 4

weekdays:
  # monday, tuesday, wednesday, thursday, friday, saturday, or sunday.
  week_start: monday
  # Always list Monday through Sunday, regardless of week_start.
  names:
    - Monday
    - Tuesday
    - Wednesday
    - Thursday
    - Friday
    - Saturday
    - Sunday
  font_size: 16
  color: "#5c6478"
  # Clear space between weekday text and the top of the grid.
  gap_after: 2

grid:
  # Space between the outside edges of adjacent cell borders.
  gap: 2
  # Empty cell borders: 0 = invisible, 1 = fully visible.
  empty_opacity: 0.2
  border_radius: 1
  border_width: 0.3
  border_color: "#5f667e"

day_numbers:
  font_size: 16
  color: "#1f2c50"
  # top_left, top_right, bottom_left, bottom_right, or center.
  position: top_left
  # Inset from the inside edge of the border; ignored for center.
  padding: 2

# Optional custom TrueType font; omit to use the bundled Noto Sans Light.
# The bundled font supports English; choose a Chinese font for Chinese labels.
# font: fonts/MyFont.ttf
# The path is relative to this YAML file, or it can be absolute.
