# Complete calendar configuration
# Use: namishu-calendar --year 2027 --month 9 --config calendar.yaml
# All distances are in millimeters; font sizes are in points.

# Paper and margins (A4 landscape)
layout:
  width: 297
  height: 210
  margin_top: 15
  margin_bottom: 10
  margin_left: 20
  margin_right: 20

# Month heading
header:
  # January through December; names can be translated.
  months:
    - JANUARY
    - FEBRUARY
    - MARCH
    - APRIL
    - MAY
    - JUNE
    - JULY
    - AUGUST
    - SEPTEMBER
    - OCTOBER
    - NOVEMBER
    - DECEMBER
  size: 20
  color: "#707a93"
  padding_left: 0
  padding_right: 0

# Weekday heading
weekday:
  # 0 = Monday, ..., 6 = Sunday
  first_day: 0
  # Always list Monday through Sunday, regardless of first_day.
  names:
    - Monday
    - Tuesday
    - Wednesday
    - Thursday
    - Friday
    - Saturday
    - Sunday
  size: 16
  color: "#5c6478"
  padding_top: 10
  padding_bottom: 4

# Day boxes
cell:
  padding: 2
  # Empty box borders: 0 = fully visible, 1 = invisible.
  hide_empty: 0.8
  border_radius: 1
  border_width: 0.3
  border_color: "#5f667e"

# Day numbers
day:
  size: 16
  color: "#1f2c50"
  # LT / RT / LB / RB / C = top left / top right / bottom left / bottom right / center
  align: LT
  padding_top: 2
  padding_bottom: 2
  padding_left: 2
  padding_right: 2

# Keep the bundled Noto Sans Light font (English; no Chinese glyphs)
font: {}

# To use a custom TrueType font, replace "font: {}" above with:
# font:
#   path: fonts/custom.ttf
# The path is relative to this YAML file, or it can be absolute.
