# Distances are in millimeters; font sizes are in points.
page:
  width: 297
  height: 210
  margin_top: 10
  margin_bottom: 10
  margin_left: 20
  margin_right: 20

title:
  months:
    - JANUARY
    - FEBRUARY
    - MARCH
    - APRIL
    - MAY
    - JUNE
    - JULY
    - AUGUST
    - SEPTEMBER
    - OCTOBER
    - NOVEMBER
    - DECEMBER
  font_size: 20
  color: "#707a93"
  gap_after: 4

weekdays:
  week_start: monday
  names:
    - Monday
    - Tuesday
    - Wednesday
    - Thursday
    - Friday
    - Saturday
    - Sunday
  font_size: 16
  color: "#5c6478"
  gap_after: 2

grid:
  gap: 2
  empty_opacity: 0.2
  border_radius: 1
  border_width: 0.3
  border_color: "#5f667e"

day_numbers:
  font_size: 16
  color: "#1f2c50"
  position: top_left
  padding: 2

font: NotoSans-Light.ttf
