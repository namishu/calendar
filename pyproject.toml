[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "namishu-calendar"
version = "0.1.0"
description = "Printable monthly calendars as A4 PDFs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND OFL-1.1"
license-files = ["LICENSE", "src/namishu_calendar/data/OFL.txt"]
authors = [{name = "Namishu"}]
keywords = ["calendar", "pdf", "printable"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["PyYAML>=6.0", "reportlab>=4.0"]

[project.urls]
Homepage = "https://github.com/namishu/calendar"
Repository = "https://github.com/namishu/calendar"
Issues = "https://github.com/namishu/calendar/issues"

[project.scripts]
namishu-calendar = "namishu_calendar.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.11", "pypdf>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
namishu_calendar = ["data/*.yaml", "data/*.ttf", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["B", "C4", "E4", "E501", "E7", "E9", "F", "I", "RUF012", "SIM", "UP"]
